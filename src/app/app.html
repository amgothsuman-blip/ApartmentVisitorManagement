<div class="app-container">

  <!-- Main Header -->
  <header class="topbar">

    <a class="brand" routerLink="/">
      <span class="brand-icon">AV</span>

      <span class="brand-text">
        <strong>ApartmentCare</strong>
        <small>VISITOR MANAGEMENT SYSTEM</small>
      </span>
    </a>

    <div class="header-right">
      <span class="security-status">
        <span class="status-dot"></span>
        Security Portal
      </span>

      <div class="profile-avatar">AV</div>
    </div>

  </header>

  <!-- Main Layout -->
  <div class="main-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

      <p class="menu-heading">MAIN MENU</p>

      <nav class="navigation">

        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <span class="nav-icon">⌂</span>
          <span>Home</span>

        </a>

        <a
          routerLink="/dashboard"
          routerLinkActive="active">

          <span class="nav-icon">▦</span>
          <span>Dashboard</span>

        </a>

        <a
          routerLink="/register-visitor"
          routerLinkActive="active">

          <span class="nav-icon">＋</span>
          <span>Register Visitor</span>

        </a>

        <a
          routerLink="/visitor-list"
          routerLinkActive="active">

          <span class="nav-icon">♙</span>
          <span>Visitors List</span>

        </a>

        <a
          routerLink="/entry-exit"
          routerLinkActive="active">

          <span class="nav-icon">⇄</span>
          <span>Entry &amp; Exit</span>

        </a>

        <a
          routerLink="/reports"
          routerLinkActive="active">

          <span class="nav-icon">▤</span>
          <span>Reports</span>

        </a>

        <a
          routerLink="/about"
          routerLinkActive="active">

          <span class="nav-icon">ⓘ</span>
          <span>About</span>

        </a>

      </nav>

      <!-- Help Card -->
      <div class="sidebar-footer">

        <div class="help-icon">?</div>

        <div class="help-content">
          <strong>Need help?</strong>
          <p>Contact your administrator.</p>
        </div>

      </div>

    </aside>

    <!-- Selected Page Appears Here -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
